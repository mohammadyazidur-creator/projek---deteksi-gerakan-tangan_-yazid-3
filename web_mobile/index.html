<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deteksi Gerakan Tangan - Kamera HP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:Arial,sans-serif;display:flex;align-items:center;flex-direction:column;min-height:100vh}
header{width:100%;padding:15px;background:#1e293b;border-bottom:2px solid #10b981;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;color:#10b981;margin:0}.badge{font-size:12px;background:#334155;padding:6px 9px;border-radius:7px;color:#38bdf8}
main{width:100%;max-width:520px;padding:12px}.video-box{width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;position:relative}
video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
#captureCanvas{display:none}.status{margin-top:12px;padding:14px;background:#1e293b;border:1px solid #334155;border-left:4px solid #10b981;border-radius:9px}
#statusTitle{font-weight:bold;color:#38bdf8;margin-bottom:5px}#statusText{font-size:13px;color:#cbd5e1;line-height:1.5}
.controls{display:flex;gap:9px;margin-top:12px}button{flex:1;border:0;border-radius:8px;padding:13px 9px;font-weight:bold;color:white;background:#2563eb;font-size:14px}
button.secondary{background:#475569}button:disabled{opacity:.5}
.note{font-size:12px;color:#94a3b8;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<header><h1>🤚 Deteksi Tangan HP</h1><span class="badge" id="connectionBadge">Menghubungkan...</span></header>
<main>
  <div class="video-box"><video id="video" autoplay playsinline muted></video></div>
  <canvas id="captureCanvas"></canvas>
  <div class="controls">
    <button id="startBtn">▶ Mulai Kamera</button>
    <button id="flipBtn" class="secondary" disabled>🔄 Ganti Kamera</button>
  </div>
  <section class="status">
    <div id="statusTitle">Menyiapkan koneksi...</div>
    <div id="statusText">Sambungkan HP melalui USB, lalu jalankan server dan program Python di PC.</div>
  </section>
  <p class="note">Biarkan halaman ini terbuka selama deteksi berlangsung. Video dikirim melalui koneksi USB ke PC untuk diproses oleh Python, OpenCV, dan MediaPipe.</p>
</main>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('captureCanvas');
const ctx = canvas.getContext('2d');
const badge = document.getElementById('connectionBadge');
const statusTitle = document.getElementById('statusTitle');
const statusText = document.getElementById('statusText');
const startBtn = document.getElementById('startBtn');
const flipBtn = document.getElementById('flipBtn');

let socket = null;
let stream = null;
let facing = 'environment';
let sendTimer = null;
let sending = false;

function status(title, text) {
  statusTitle.textContent = title;
  statusText.textContent = text;
}
function connectSocket() {
  return new Promise((resolve, reject) => {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(`${protocol}//${location.host}/ws/phone`);
    socket.binaryType = 'arraybuffer';
    socket.onopen = () => {
      badge.textContent = 'USB TERHUBUNG';
      resolve();
    };
    socket.onerror = () => reject(new Error('WebSocket gagal. Pastikan server_hp.py aktif dan ADB reverse sudah dijalankan.'));
    socket.onclose = () => {
      badge.textContent = 'TERPUTUS';
      status('Koneksi terputus', 'Periksa server PC dan kabel USB, lalu muat ulang halaman.');
      stopSending();
    };
  });
}
async function startCamera() {
  try {
    if (!window.isSecureContext) {
      throw new Error('Browser tidak menganggap alamat ini aman. Gunakan http://localhost:8000 melalui ADB reverse.');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Browser tidak mendukung akses kamera pada alamat ini.');
    }
    startBtn.disabled = true;
    status('Menghubungkan ke PC...', 'Membuka koneksi USB.');
    if (!socket || socket.readyState !== WebSocket.OPEN) await connectSocket();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    await video.play();
    flipBtn.disabled = false;
    startBtn.textContent = 'Kamera Aktif';
    badge.textContent = 'MENGIRIM VIDEO';
    status('Kamera aktif', 'Video HP sedang dikirim ke PC. Lihat jendela deteksi Python di komputer.');
    startSending();
  } catch (err) {
    startBtn.disabled = false;
    status('Gagal memulai kamera', err.message || String(err));
    badge.textContent = 'PERIKSA KONEKSI';
  }
}
function startSending() {
  stopSending();
  sendTimer = setInterval(() => {
    if (!stream || !socket || socket.readyState !== WebSocket.OPEN ||
        video.readyState < 2 || sending || socket.bufferedAmount > 700000) return;
    sending = true;
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      if (blob && socket && socket.readyState === WebSocket.OPEN) socket.send(blob);
      sending = false;
    }, 'image/jpeg', 0.7);
  }, 100); // sekitar 10 frame per detik
}
function stopSending() {
  if (sendTimer) clearInterval(sendTimer);
  sendTimer = null;
  sending = false;
}
async function switchCamera() {
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  facing = facing === 'user' ? 'environment' : 'user';
  await startCamera();
}
startBtn.addEventListener('click', startCamera);
flipBtn.addEventListener('click', switchCamera);
window.addEventListener('beforeunload', () => {
  stopSending();
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (socket) socket.close();
});
</script>
</body>
</html>
